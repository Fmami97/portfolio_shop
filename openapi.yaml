openapi: 3.1.1
info:
  title: portfolio shop
  description: An API that is used to manage a shop, create user accounts and handle transactions.
  version: 1.0.0

tags:
  - name: Utility
    description: other requests
  - name: Authentication
    description: requests that handles user sessions
  - name: Products
    description: requests regarding the shop's products
  - name: Users
    description: requests regarding the users  (AUTHENTICATION PARTIALLY REQUIRED)
  - name: UserAuth
    description: requests regarding a specific user's authentication methods  (AUTHENTICATION REQUIRED)
  - name: Cart
    description: requests regarding an user's shopping cart, automatically created if it doesn't exist (AUTHENTICATION REQUIRED)
  - name: CartItems
    description: requests regarding products in the shopping cart (AUTHENTICATION REQUIRED)
  - name: Orders
    description: requests regarding each user's transactions (AUTHENTICATION REQUIRED)
servers:
  - url: http://localhost:8000/v1

paths:
  /auth/login:
    post:
      description: creates an user session by the usual username OR email / password authentication method
      tags:
        - Authentication
      summary: creates an user session by the usual username OR email / password authentication method
      operationId: login
  /auth/verify_password:
    post:
      summary: makes sure the password matches the provided input, used as a verification step before important tasks

      description: makes sure the password matches the provided input, used as a verification step before important tasks
      tags:
        - Authentication
        - Utility
      operationId: verifyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserAuthPassword"
  /auth/logout:
    get:
      summary: ends the user's session regardless of authentication method
      description: ends the user's session regardless of authentication method
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Authentication

  /docs:
    get:
      summary: displays this YAML file via the swagger-ui library
      description: displays this YAML file via the swagger-ui library
      tags:
        - Utility
  /auth/google:
    get:
      summary: redirects the user to google's authentication services to allow access to the website
      description: redirects the user to google's authentication services to allow access to the website
      tags:
        - Authentication
  /auth/facebook:
    get:
      summary: redirects the user to facebook's authentication services to allow access to the website
      description: redirects the user to facebook's authentication services to allow access to the website
      tags:
        - Authentication
  /auth/google/callback:
    get:
      summary: After authentication, creates a user session with the Google OAuth method or redirects to the sign-in page.
      description: After authentication, creates a user session with the Google OAuth method or redirects to the sign-in page.
      tags:
        - Authentication
  /auth/facebook/callback:
    get:
      summary: After authentication, creates a user session with the Facebook OAuth method or redirects to the sign-in page.
      description: After authentication, creates a user session with the Facebook OAuth method or redirects to the sign-in page.
      tags:
        - Utility
  /sales:
    get:
      tags:
        - Products
      summary: Retrieves the top 3 most sold products in the database
      description: Retrieves the top 3 most sold products in the database
      operationId: getBestSales
      responses:
        "200":
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "500":
          description: server error

  /products:
    get:
      tags:
        - Products
      summary: List all products in the shop
      description: List all products in the shop
      operationId: getProducts
      responses:
        "200":
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "500":
          description: server error
  /products/{product_id}:
    get:
      tags:
        - Products
      summary: get a single shop product by providing an id
      description: get a single shop product by providing an id
      operationId: getProductById
      parameters:
        - name: product_id
          in: path
          required: true
      responses:
        "200":
          description: the requested product
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Product"
        "404":
          description: product not found
  /users:
    get:
      tags:
        - Users
      summary: get all users from the database, without sensitive data
      description: get all users from the database, without sensitive data
      operationId: getUsers
      responses:
        "200":
          description: All users in the database, ordered from most to least recently created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500":
          description: server error
    post:
      tags:
        - Users
        - Authentication
      summary: Create a new user, once a proper authentication method was provided.
      description: Create a new user, once a proper authentication method was provided.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserInput"
      responses:
        "201":
          description: the created user, without the authentication data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{user_id}:
    get:
      tags:
        - Users
      summary: get a single user's info, without sensitive data
      description: get a single user's info, without sensitive data
      operationId: getUserById
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: the requested user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: user not found
        "500":
          description: server error
    put:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Users
      summary: updates the user
      description: updates the user
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error
    delete:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Users
      summary: deletes the user with the selected id
      description: deletes the user with the selected id
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "204":
          description: user deleted successfully
        "404":
          description: user not found
        "500":
          description: server error
  /users/{user_id}/auth:
    get:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - UserAuth
      summary: fetches all auth methods available for that user
      description: fetches all auth methods available for that user
      operationId: getUserAuthList
      parameters:
        - name: user_id
          example: 1
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: all auth methods available for that user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAuth"
              example:
                - id: 1
                  user_id: 1
                  provider: google
                  provider_id: google-uid1234
                  password_hash: null
                - id: 2
                  user_id: 1
                  provider: local
                  provider_id: null
                  password_hash: fc105a7df8af9803682122d9c6eca277b9eceb85e16df10203329cc033b870ea
                - id: 3
                  user_id: 1
                  provider: facebook
                  provider_id: facebook-uid1234
                  password_hash: null
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error

    post:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - UserAuth
      summary: updates or creates a traditional username/password auth method
      description: updates or creates a traditional username/password auth method
      operationId: updateOrCreateUserAuthPassword
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserAuthPassword"
      responses:
        "200":
          description: all auth methods available for that user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuth"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's
        "404":
          description: user not found
        "500":
          description: server error

  /users/{user_id}/auth/{provider}:
    get:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - UserAuth
      summary: requests a specific user authentication method
      description: requests a specific user authentication method
      operationId: getUserAuthByProvider
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
        - name: provider
          in: path
          schema:
            type: string
            example: google
          required: true
      responses:
        "200":
          description: all auth methods available for that user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuth"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / provider not found
        "500":
          description: server error
    delete:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - UserAuth
      summary: deletes the desired authentication method
      description: deletes the desired authentication method
      operationId: deleteUserAuthByProvider
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
        - name: provider
          in: path
          schema:
            type: string
            example: google
          required: true
      responses:
        "204":
          description: userAuth deleted successfully
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / provider not found
        "500":
          description: server error

  /users/{user_id}/cart:
    get:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Cart
      summary: fetches the cart's infomations, without its actual items
      description: fetches the cart's infomations, without its actual items
      operationId: getCartByUserId
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      responses:
        "200":
          description: the cart's without the items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "204":
          description: cart deleted
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error

    delete:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Cart
      summary: delete the user's cart, all cart items are automatically deleted too
      description: delete the user's cart, all cart items are automatically deleted too
      operationId: deleteCart
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      responses:
        "204":
          description: cart deleted
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error

  /users/{user_id}/cart/checkout:
    post:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Cart
      summary: a combination of many requests to create a new order with all items in the cart
      description: a combination of many requests to create a new order with all items in the cart
      operationId: checkout
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      responses:
        "200":
          description: all auth methods available for that user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error

  /users/{user_id}/cart/items:
    get:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: fetches all products in the user's cart
      description: fetches all products in the user's cart
      operationId: getCartItems
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      responses:
        "200":
          description: all products in the user's cart
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItem"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error
    post:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: Adds a new product in the user's cart
      description: Adds a new product in the user's cart
      operationId: createCartItem
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "201":
          description: the created cart_item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error
    put:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: updates multiple products's quantities in the cart
      description: updates multiple products's quantities in the cart
      operationId: updateCartItems
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdateInput"
      responses:
        "200":
          description: all updated products in the user's cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error
    delete:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: deletes all the desired items from the cart
      description: deletes all the desired items from the cart
      operationId: deleteCartItems
      parameters:
        - name: user_id
          in: path
          schema:
            type: integer
            example: 1
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
      responses:
        "204":
          description: cart items deleted successfully
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error

  /users/{user_id}/cart/items/{product_id}:
    get:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: fetches all details of a specific product in the cart
      description: fetches all details of a specific product in the cart
      operationId: getCartItemByIds
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      required:
        - user_id
        - product_id
      responses:
        "200":
          description: the desired product in the cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / cart_item not found
        "500":
          description: server error
    put:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: updates a single product in the cart
      description: updates a single product in the cart
      operationId: updateCartItem
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "200":
          description: the updated cart item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / cart_item  not found
        "500":
          description: server error
    delete:
      security:
        - basicAuth: []
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - CartItems
      summary: deletes a specific item in the user's cart
      description: deletes a specific item in the user's cart
      operationId: deleteCartItem
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "204":
          description: cart item deleted successfully
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / cart_item not found
        "500":
          description: server error

  /users/{user_id}/order/:
    get:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Orders
      summary: fetches all orders made by the user
      description: fetches all orders made by the user
      operationId: getOrdersByUserId
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: all orders made for that user, ordered by date (earliest to latest order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user not found
        "500":
          description: server error

  /users/{user_id}/order/{order_id}:
    get:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Orders
      summary: fetches the order and the items that were bought
      description: fetches the order and the items that were bought
      operationId: getOrderByIds
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: the order and order items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderWithItems"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / order not found
        "500":
          description: server error

    put:
      security:
        - googleOAuth: []
        - facebookOAuth: []
      tags:
        - Orders
      summary: updates the status of the users order
      description: updates the status of the users order
      operationId: updateOrderStatus
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: the contents of the Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: unauthorized without authentication
        "403":
          description: forbidden, the user_id doesn't match the current session's user_id
        "404":
          description: user / order not found
        "500":
          description: server error

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "tomato sauce"
        price:
          type: number
          example: 4.90
        description:
          type: string
          example: "A famous brand of tomato sauce"
          nullable: true
      required:
        - id
        - name
        - price
    ProductInput:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        description:
          type: string
      required:
        - name
        - price
    Sale:
      type: object
      properties:
        product_id:
          type: integer
          example: 1
        name:
          type: string
          example: "tomato sauce"
        price:
          type: number
          example: 4.90
        description:
          type: string
          example: "A famous brand of tomato sauce"
          nullable: true
        total_sold:
          type: integer
          example: 4
      required:
        - id
        - name
        - price
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: "JoDo31"
        fullname:
          type: string
          example: "John doe"
        email:
          type: string
          example: "jdoe123@gmail.com"
        created_at:
          type: string
          format: date
          example: "2026-05-17"
          pattern: /([0-9]{4})-(?:[0-9]{2})-([0-9]{2})/
          default: "SQL NOW FUNCTION"
      required:
        - id
        - username
        - email
        - created_at
    UserAuth:
      type: object
      description: at least one of provider_id or password_hash must be present.
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        provider:
          type: string
          example: local
        provider_id:
          type: string
          nullable: true
          example: 123456789
          description: must be present if password_hash isn't provided
        password_hash:
          type: string
          nullable: true
          description: must be present if provider_id isn't provided
      required:
        - id
        - user_id
        - provider
      anyOf:
        - required: [provider_id]
        - required: [password_hash]

    NewUserAuthPassword:
      type: object
      properties:
        password:
          type: string
      required:
        - password

    NewUserInput:
      description: at least one of provider_id or password must be present.
      type: object
      properties:
        fullname:
          type: string
          example: "John doe"
        username:
          type: string
          example: "JoDo31"
        email:
          type: string
          example: "jdoe123@gmail.com"
        provider:
          type: string
          description: defaults to local if left empty
          example: local
        provider_id:
          type: string
          description: must be present if password isn't provided
          example: null
        password:
          type: string
          description: must be present if provider_id isn't provided
          example: myawesomeP@ssword123456!
      required:
        - username
        - email
        - provider
      anyOf:
        - required: [provider_id]
        - required: [password]

    UserProfileInput:
      description: designed to update username and fullname rows in the database
      type: object
      properties:
        username:
          type: string
          example: "JoDo31"
        fullname:
          type: string
          example: "John Doe"
      anyOf:
        - required: [username]
        - required: [fullname]

    Cart:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date
          example: "2026-05-17"
          pattern: /([0-9]{4})-(?:[0-9]{2})-([0-9]{2})/
          default: "SQL NOW FUNCTION"
      required:
        - user_id
        - created_at

    CartItem:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        name:
          type: string
          example: "tomato sauce"
        price:
          type: number
          example: 4.90
        description:
          type: string
          example: "A famous brand of tomato sauce"
          nullable: true
        quantity:
          type: integer
          example: 4
        total_price:
          type: number
          example: 19.6
      required:
        - user_id
        - product_id
        - quantity

    CartItemInput:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 4
      required:
        - user_id
        - product_id
        - quantity

    CartItemUpdateInput:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        cart_items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 4

      required:
        - user_id
        - cart_items

    OrderWithItems:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
        order_items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required:
        - order
        - order_items

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        delivery_address:
          type: string
          example: "Hell's kitchen"
        created_at:
          type: string
          format: date
          example: "2026-05-17"
          pattern: /([0-9]{4})-(?:[0-9]{2})-([0-9]{2})/
          default: "SQL NOW FUNCTION"
        status:
          type: string
          example: "COMPLETED"
          description: one of these three values -> PENDING ; DELIVERY ; COMPLETED
        total_price:
          type: number
          example: 19.6
          description: the sum of all ordered items
      required:
        - id
        - user_id
        - delivery_address
        - created_at
        - status
        - total_price

    OrderItem:
      type: object
      properties:
        order_id:
          type: integer
          example: 1
        name:
          type: string
          example: "tomato sauce"
        price:
          type: number
          example: 4.90
        description:
          type: string
          example: "A famous brand of tomato sauce"
          nullable: true
        quantity:
          type: integer
          example: 4
        total_price:
          type: number
          example: 19.6
          description: the sum of all ordered items
      required:
        - order_id
        - name
        - price
        - quantity

    OrderStatusInput:
      type: object
      properties:
        status:
          type: string
          example: PENDING
          description: one of these three values -> PENDING ; DELIVERY ; COMPLETED
      required:
        - status

  securitySchemes:
    googleOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            profile: Access to profile
            email: Access to email
    facebookOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://www.facebook.com/v10.0/dialog/oauth
          tokenUrl: https://graph.facebook.com/v10.0/oauth/access_token
          scopes:
            profile: Access to profile
            email: Access to email
    basicAuth:
      type: http
      scheme: basic
